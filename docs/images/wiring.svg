<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1104" width="1200" height="1104" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1200" height="1104" rx="24" fill="#FFFFFF"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#0A0A0A">Luxor — system and pin map</text>
<text x="40" y="88" font-size="16" fill="#5C5648">Everything inside the dashed line is already on the Waveshare module. The only connection you make is the battery plug.</text>
<rect x="30" y="110" width="1140" height="794" rx="22" fill="none" stroke="#A07C14" stroke-width="2" stroke-dasharray="8 6"/>
<text x="50" y="138" font-size="14" font-weight="600" fill="#A07C14" letter-spacing="1.5">WAVESHARE ESP32-S3-TOUCH-LCD-1.46 MODULE</text>
<rect x="430" y="160" width="700" height="144" rx="12" fill="#B8860B" fill-opacity="0.07" stroke="#B8860B" stroke-width="1.5"/>
<text x="446" y="186" font-size="16" font-weight="700" fill="#B8860B">Display  SPD2010  412x412</text>
<rect x="446" y="196" width="68" height="22" rx="11" fill="#B8860B"/>
<text x="480" y="212" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPIO40</text>
<text x="524" y="212" font-size="14" fill="#0A0A0A">QSPI SCK</text>
<rect x="786" y="196" width="68" height="22" rx="11" fill="#B8860B"/>
<text x="820" y="212" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPIO46</text>
<text x="864" y="212" font-size="14" fill="#0A0A0A">QSPI D0</text>
<rect x="446" y="222" width="68" height="22" rx="11" fill="#B8860B"/>
<text x="480" y="238" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPIO45</text>
<text x="524" y="238" font-size="14" fill="#0A0A0A">QSPI D1</text>
<rect x="786" y="222" width="68" height="22" rx="11" fill="#B8860B"/>
<text x="820" y="238" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPIO42</text>
<text x="864" y="238" font-size="14" fill="#0A0A0A">QSPI D2</text>
<rect x="446" y="248" width="68" height="22" rx="11" fill="#B8860B"/>
<text x="480" y="264" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPIO41</text>
<text x="524" y="264" font-size="14" fill="#0A0A0A">QSPI D3</text>
<rect x="786" y="248" width="68" height="22" rx="11" fill="#B8860B"/>
<text x="820" y="264" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPIO21</text>
<text x="864" y="264" font-size="14" fill="#0A0A0A">QSPI CS</text>
<text x="446" y="292" font-size="13" fill="#5C5648">40 MHz</text>
<path d="M320 232.0 H430" stroke="#B8860B" stroke-width="3" fill="none"/>
<circle cx="320" cy="232.0" r="5" fill="#B8860B"/>
<rect x="430" y="314" width="700" height="114" rx="12" fill="#2F6FB5" fill-opacity="0.07" stroke="#2F6FB5" stroke-width="1.5"/>
<text x="446" y="340" font-size="16" font-weight="700" fill="#2F6FB5">I2C bus  (400 kHz)</text>
<rect x="446" y="350" width="68" height="22" rx="11" fill="#2F6FB5"/>
<text x="480" y="366" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPIO11</text>
<text x="524" y="366" font-size="14" fill="#0A0A0A">SDA</text>
<rect x="786" y="350" width="68" height="22" rx="11" fill="#2F6FB5"/>
<text x="820" y="366" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPIO10</text>
<text x="864" y="366" font-size="14" fill="#0A0A0A">SCL</text>
<text x="446" y="394" font-size="13" fill="#5C5648">0x53 touch SPD2010 · 0x6A or 0x6B IMU QMI8658 · 0x51 RTC PCF85063 · 0x20 IO expander TCA9554</text>
<text x="446" y="416" font-size="13" fill="#5C5648">TCA9554: EXIO0 + EXIO1 = LCD and touch reset (pulsed together at boot) · EXIO2 = microSD chip select</text>
<path d="M320 371.0 H430" stroke="#2F6FB5" stroke-width="3" fill="none"/>
<circle cx="320" cy="371.0" r="5" fill="#2F6FB5"/>
<rect x="430" y="438" width="700" height="96" rx="12" fill="#B5527A" fill-opacity="0.07" stroke="#B5527A" stroke-width="1.5"/>
<text x="446" y="464" font-size="16" font-weight="700" fill="#B5527A">Speaker  I2S out → PCM5101 DAC → amplifier</text>
<rect x="446" y="474" width="68" height="22" rx="11" fill="#B5527A"/>
<text x="480" y="490" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPIO48</text>
<text x="524" y="490" font-size="14" fill="#0A0A0A">BCLK</text>
<rect x="786" y="474" width="68" height="22" rx="11" fill="#B5527A"/>
<text x="820" y="490" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPIO38</text>
<text x="864" y="490" font-size="14" fill="#0A0A0A">WS</text>
<rect x="446" y="500" width="68" height="22" rx="11" fill="#B5527A"/>
<text x="480" y="516" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPIO47</text>
<text x="524" y="516" font-size="14" fill="#0A0A0A">DOUT</text>
<path d="M320 486.0 H430" stroke="#B5527A" stroke-width="3" fill="none"/>
<circle cx="320" cy="486.0" r="5" fill="#B5527A"/>
<rect x="430" y="544" width="700" height="96" rx="12" fill="#B5527A" fill-opacity="0.07" stroke="#B5527A" stroke-width="1.5"/>
<text x="446" y="570" font-size="16" font-weight="700" fill="#B5527A">Microphone  I2S in</text>
<rect x="446" y="580" width="68" height="22" rx="11" fill="#B5527A"/>
<text x="480" y="596" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPIO15</text>
<text x="524" y="596" font-size="14" fill="#0A0A0A">BCLK</text>
<rect x="786" y="580" width="68" height="22" rx="11" fill="#B5527A"/>
<text x="820" y="596" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPIO2</text>
<text x="864" y="596" font-size="14" fill="#0A0A0A">WS</text>
<rect x="446" y="606" width="68" height="22" rx="11" fill="#B5527A"/>
<text x="480" y="622" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPIO39</text>
<text x="524" y="622" font-size="14" fill="#0A0A0A">DIN</text>
<path d="M320 592.0 H430" stroke="#B5527A" stroke-width="3" fill="none"/>
<circle cx="320" cy="592.0" r="5" fill="#B5527A"/>
<rect x="430" y="650" width="700" height="122" rx="12" fill="#4A4A4A" fill-opacity="0.07" stroke="#4A4A4A" stroke-width="1.5"/>
<text x="446" y="676" font-size="16" font-weight="700" fill="#4A4A4A">Controls and power</text>
<rect x="446" y="686" width="68" height="22" rx="11" fill="#4A4A4A"/>
<text x="480" y="702" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPIO6</text>
<text x="524" y="702" font-size="14" fill="#0A0A0A">PWR key (low = pressed)</text>
<rect x="786" y="686" width="68" height="22" rx="11" fill="#4A4A4A"/>
<text x="820" y="702" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPIO0</text>
<text x="864" y="702" font-size="14" fill="#0A0A0A">BOOT key (low = pressed)</text>
<rect x="446" y="712" width="68" height="22" rx="11" fill="#4A4A4A"/>
<text x="480" y="728" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPIO7</text>
<text x="524" y="728" font-size="14" fill="#0A0A0A">Power hold (high = stay on)</text>
<rect x="786" y="712" width="68" height="22" rx="11" fill="#4A4A4A"/>
<text x="820" y="728" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPIO5</text>
<text x="864" y="728" font-size="14" fill="#0A0A0A">Backlight PWM (LEDC)</text>
<rect x="446" y="738" width="68" height="22" rx="11" fill="#4A4A4A"/>
<text x="480" y="754" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPIO8</text>
<text x="524" y="754" font-size="14" fill="#0A0A0A">Battery sense ADC1 ch7, 3:1 divider</text>
<path d="M320 711.0 H430" stroke="#4A4A4A" stroke-width="3" fill="none"/>
<circle cx="320" cy="711.0" r="5" fill="#4A4A4A"/>
<rect x="430" y="782" width="700" height="92" rx="12" fill="#2E8B57" fill-opacity="0.07" stroke="#2E8B57" stroke-width="1.5"/>
<text x="446" y="808" font-size="16" font-weight="700" fill="#2E8B57">USB  (native Serial/JTAG)</text>
<rect x="446" y="818" width="68" height="22" rx="11" fill="#2E8B57"/>
<text x="480" y="834" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPIO19</text>
<text x="524" y="834" font-size="14" fill="#0A0A0A">USB D-</text>
<rect x="786" y="818" width="68" height="22" rx="11" fill="#2E8B57"/>
<text x="820" y="834" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPIO20</text>
<text x="864" y="834" font-size="14" fill="#0A0A0A">USB D+</text>
<text x="446" y="862" font-size="13" fill="#5C5648">VID:PID 303a:1001</text>
<path d="M320 828.0 H430" stroke="#2E8B57" stroke-width="3" fill="none"/>
<circle cx="320" cy="828.0" r="5" fill="#2E8B57"/>
<rect x="70" y="160" width="250" height="714" rx="18" fill="#0A0A0A"/>
<text x="195.0" y="206" font-size="22" font-weight="700" fill="#D4AF37" text-anchor="middle">ESP32-S3</text>
<text x="195.0" y="240" font-size="14" fill="#F2EEE3" text-anchor="middle">dual-core LX7 · 240 MHz</text>
<text x="195.0" y="264" font-size="14" fill="#F2EEE3" text-anchor="middle">16 MB flash · 8 MB PSRAM</text>
<text x="195.0" y="288" font-size="14" fill="#F2EEE3" text-anchor="middle">Wi-Fi 2.4 GHz · Bluetooth LE</text>
<text x="195.0" y="312" font-size="14" fill="#F2EEE3" text-anchor="middle">firmware: Luxor</text>
<circle cx="98" cy="727" r="7" fill="#B8860B"/>
<text x="114" y="732" font-size="14" fill="#F2EEE3">QSPI — display</text>
<circle cx="98" cy="755" r="7" fill="#2F6FB5"/>
<text x="114" y="760" font-size="14" fill="#F2EEE3">I2C — sensors, touch</text>
<circle cx="98" cy="783" r="7" fill="#B5527A"/>
<text x="114" y="788" font-size="14" fill="#F2EEE3">I2S — audio</text>
<circle cx="98" cy="811" r="7" fill="#4A4A4A"/>
<text x="114" y="816" font-size="14" fill="#F2EEE3">GPIO / ADC / PWM</text>
<circle cx="98" cy="839" r="7" fill="#2E8B57"/>
<text x="114" y="844" font-size="14" fill="#F2EEE3">USB</text>
<text x="40" y="944" font-size="18" font-weight="700" fill="#0A0A0A">You connect</text>
<rect x="40" y="960" width="570" height="124" rx="14" fill="#C0392B" fill-opacity="0.07" stroke="#C0392B" stroke-width="1.5"/>
<text x="56" y="988" font-size="16" font-weight="700" fill="#C0392B">LiPo cell → board battery header (MX1.25, 2-pin)</text>
<text x="56" y="1014" font-size="14" fill="#0A0A0A">Red wire → header pin marked +     ·     Black wire → pin marked −</text>
<text x="56" y="1038" font-size="14" fill="#0A0A0A">Single cell, 3.7 V nominal, 4.2 V full. Charged on board from USB-C.</text>
<text x="56" y="1062" font-size="14" font-weight="700" fill="#C0392B">Check polarity with a meter first: seller plugs are often reversed.</text>
<rect x="630" y="960" width="530" height="124" rx="14" fill="#2E8B57" fill-opacity="0.07" stroke="#2E8B57" stroke-width="1.5"/>
<text x="646" y="988" font-size="16" font-weight="700" fill="#2E8B57">USB-C data cable → PC  (flash, serial log, charge)</text>
<text x="646" y="1014" font-size="14" fill="#0A0A0A">Enumerates as a COM port (Windows) or /dev/ttyACM0 (Linux).</text>
<text x="646" y="1038" font-size="14" fill="#0A0A0A">Must be a DATA cable: charge-only cables flash nothing.</text>
<text x="646" y="1062" font-size="14" fill="#0A0A0A">Overmould up to 12.5 x 7 mm fits the case mouth as modelled.</text>
</svg>